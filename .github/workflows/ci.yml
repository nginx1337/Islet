name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # Islet targets macOS 27 and needs the macOS 27 SDK (Xcode 27).
    # Change the runner label if GitHub names its macOS 27 image differently.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          sw_vers
          xcrun --show-sdk-version
          swift --version
      - name: Security audit
        run: scripts/audit.sh
      - name: Unit tests
        run: swift test
      # Pull requests only: the debug build draws the island and every settings page to PNG files
      # (no permissions, no network), kept for a week so a change can be checked by eye.
      - name: Render previews
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 8
        run: |
          swift build
          "$(swift build --show-bin-path)/Islet" --render-preview build/preview
      - name: Upload previews
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: build/preview
          retention-days: 7
          if-no-files-found: ignore
      - name: Build app bundle
        run: scripts/build-app.sh release
      - name: Release build has no debug hooks or build paths
        run: |
          BIN=build/Islet.app/Contents/MacOS/Islet
          if strings -a "$BIN" | grep -E "render-preview|/Users/|/home/"; then
            echo "Debug-only code or local paths found in the release binary" >&2
            exit 1
          fi
          if nm -ap "$BIN" | grep -E " (OSO|SO) "; then
            echo "Debug symbols with source paths found in the release binary" >&2
            exit 1
          fi
      - name: Hardened runtime and no debugging entitlements
        run: |
          codesign -d --verbose=2 build/Islet.app 2>&1 | grep -E "flags=.*runtime"
          if codesign -d --entitlements - build/Islet.app 2>/dev/null | grep -E "get-task-allow|disable-library-validation|allow-jit|allow-unsigned-executable-memory|allow-dyld-environment-variables"; then
            echo "The release build has a debugging or code-loading entitlement" >&2
            exit 1
          fi
      - name: Bundle contains the adapter and its license
        run: |
          test -f build/Islet.app/Contents/Resources/mediaremote-adapter.pl
          test -d build/Islet.app/Contents/Frameworks/MediaRemoteAdapter.framework
          test -x build/Islet.app/Contents/Helpers/MediaRemoteAdapterTestClient
          test -f build/Islet.app/Contents/Resources/Licenses/mediaremote-adapter-LICENSE.txt
          codesign --verify --deep --strict build/Islet.app
